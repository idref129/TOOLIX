<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Défi clic ! — Toolix</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;font-family:system-ui,Arial,sans-serif;color:#102a56;background:linear-gradient(135deg,#eaf5ff,#f5efff)}
main{width:min(100%,560px);background:white;border-radius:24px;padding:26px;text-align:center;box-shadow:0 16px 45px #12305b1a}
.logo{font-size:14px;font-weight:800;color:#1687ff;letter-spacing:.08em}
h1{margin:10px 0;font-size:clamp(28px,6vw,42px)}
p{line-height:1.5;color:#52627a}
input{width:100%;padding:12px;border:1px solid #ccd7e8;border-radius:12px;font-size:16px;margin:10px 0}
.stats{display:flex;gap:12px;justify-content:center;margin:22px 0}
.stat{background:#f1f6ff;border-radius:14px;padding:12px 18px;min-width:115px}
.stat strong{display:block;font-size:28px;color:#1468e8}
button{border:0;border-radius:14px;padding:15px 22px;font-size:17px;font-weight:750;cursor:pointer;background:#1479f8;color:white;box-shadow:0 7px 0 #0754b8}
button:disabled{cursor:default;opacity:.65}
#message{min-height:28px;font-weight:700;color:#1468e8;margin-top:18px}
#leaderboard{text-align:left;padding-left:28px;color:#263b59}
#leaderboard li{padding:6px 0;overflow-wrap:anywhere}
section{margin-top:28px;border-top:1px solid #e5ebf4;padding-top:14px}
.small{font-size:12px;color:#8390a4}
</style>
</head>
<body>
<main>
  <div class="logo">⚡ TOOLIX</div>
  <h1>Défi clic !</h1>
  <p>Clique autant de fois que possible en <b>10 secondes</b> !</p>

  <label for="nickname">Ton pseudo pour le classement</label>
  <input id="nickname" maxlength="20" autocomplete="nickname"
         placeholder="Ex. SuperJoueur">

  <div class="stats">
    <div class="stat">Temps<strong id="time">10</strong></div>
    <div class="stat">Clics<strong id="score">0</strong></div>
  </div>

  <button id="play">▶ Commencer</button>
  <div id="message" aria-live="polite">Entre un pseudo et commence à jouer !</div>

  <section>
    <h2>🏆 Classement mondial</h2>
    <p class="small">Les 10 meilleurs scores enregistrés</p>
    <ol id="leaderboard"><li>Chargement du classement…</li></ol>
    <button id="refresh" type="button">↻ Actualiser</button>
  </section>
  <footer class="small">Mini-jeu gratuit • Toolix</footer>
</main>

<script>
(() => {
  const API = "https://hshvymkqupzaincpatit.supabase.co/functions/v1/leaderboard-api";
  const play = document.getElementById("play");
  const timeEl = document.getElementById("time");
  const scoreEl = document.getElementById("score");
  const message = document.getElementById("message");
  const nickname = document.getElementById("nickname");
  const list = document.getElementById("leaderboard");
  const refresh = document.getElementById("refresh");

  let score = 0, timeLeft = 10, running = false, timer = null;

  async function loadLeaderboard() {
    list.replaceChildren();
    const loading = document.createElement("li");
    loading.textContent = "Chargement…";
    list.appendChild(loading);

    try {
      const response = await fetch(API);
      if (!response.ok) throw new Error("HTTP " + response.status);
      const result = await response.json();
      list.replaceChildren();

      if (!result.leaderboard || result.leaderboard.length === 0) {
        const item = document.createElement("li");
        item.textContent = "Aucun score pour le moment. Sois le premier !";
        list.appendChild(item);
        return;
      }

      result.leaderboard.forEach((entry) => {
        const item = document.createElement("li");
        item.textContent = `${entry.nickname} — ${entry.score} clics`;
        list.appendChild(item);
      });
    } catch (error) {
      list.replaceChildren();
      const item = document.createElement("li");
      item.textContent = "Classement indisponible. Vérifie la connexion.";
      list.appendChild(item);
      console.error(error);
    }
  }

  async function saveScore() {
    const name = nickname.value.trim();
    message.textContent = "Enregistrement du score…";
    play.disabled = true;

    try {
      const response = await fetch(API, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ nickname: name, score })
      });
      const result = await response.json();
      if (!response.ok || !result.success) {
        throw new Error(result.error || "Enregistrement impossible");
      }
      message.textContent = `Score enregistré : ${score} clics !`;
      await loadLeaderboard();
    } catch (error) {
      message.textContent = "Score non enregistré. Erreur : " + error.message;
      console.error(error);
    } finally {
      play.disabled = false;
      play.textContent = "↻ Rejouer";
    }
  }

  play.addEventListener("click", () => {
    if (running) {
      score++;
      scoreEl.textContent = score;
      return;
    }

    if (!nickname.value.trim() || nickname.value.trim().length > 20) {
      message.textContent = "Entre un pseudo de 1 à 20 caractères.";
      nickname.focus();
      return;
    }

    score = 0;
    timeLeft = 10;
    running = true;
    scoreEl.textContent = score;
    timeEl.textContent = timeLeft;
    message.textContent = "Vite, clique !";
    play.textContent = "⚡ CLIQUE !";

    timer = setInterval(() => {
      timeLeft--;
      timeEl.textContent = timeLeft;

      if (timeLeft <= 0) {
        clearInterval(timer);
        running = false;
        play.textContent = "Enregistrement…";
        message.textContent = `Terminé ! Tu as fait ${score} clics.`;
        saveScore();
      }
    }, 1000);
  });

  refresh.addEventListener("click", loadLeaderboard);
  loadLeaderboard();
})();
</script>
</body>
</html>
