<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le Nombre Secret — Toolix</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;display:grid;place-items:center;
  padding:20px;font-family:system-ui,Arial,sans-serif;color:#172554;
  background:linear-gradient(135deg,#dbeafe,#ede9fe)
}
main{
  width:min(100%,480px);background:white;border-radius:26px;
  padding:28px;text-align:center;box-shadow:0 18px 50px #312e811c
}
.logo{font-weight:900;letter-spacing:2px;color:#6366f1;font-size:14px}
h1{font-size:clamp(28px,7vw,40px);margin:12px 0}
p{color:#64748b;line-height:1.5}
.number{
  font-size:54px;font-weight:900;color:#6366f1;
  background:#eef2ff;border-radius:20px;padding:12px;margin:20px 0
}
input{
  width:100%;padding:15px;border:2px solid #c7d2fe;border-radius:13px;
  font-size:20px;text-align:center;margin:8px 0 14px
}
button{
  border:0;border-radius:13px;padding:14px 20px;font-size:16px;
  font-weight:800;cursor:pointer;background:#6366f1;color:white
}
button:disabled{opacity:.5;cursor:default}
.secondary{background:#e0e7ff;color:#3730a3;margin-top:10px}
#message{min-height:48px;font-weight:750;color:#4f46e5;margin:18px 0}
.stat{background:#f8fafc;border-radius:14px;padding:12px}
footer{font-size:12px;color:#94a3b8;margin-top:22px}
</style>
</head>
<body>
<main>
  <div class="logo">⚡ TOOLIX</div>
  <h1>🔢 Nombre Secret</h1>
  <p>J'ai choisi un nombre entre <b>1 et 100</b>.<br>
  À toi de le trouver avec le moins d'essais possible !</p>

  <div class="number" id="display">?</div>

  <label for="guess">Quel est ton nombre ?</label>
  <input id="guess" type="number" min="1" max="100"
    placeholder="Entre 1 et 100" autocomplete="off">

  <button id="try">Deviner !</button>
  <div id="message" aria-live="polite">À toi de jouer ! 🍀</div>

  <div class="stat">Nombre d'essais : <b id="attempts">0</b></div>
  <button class="secondary" id="restart">↻ Nouvelle partie</button>
  <footer>Mini-jeu gratuit • Toolix</footer>
</main>

<script>
(() => {
  const input = document.getElementById("guess");
  const tryBtn = document.getElementById("try");
  const restartBtn = document.getElementById("restart");
  const message = document.getElementById("message");
  const display = document.getElementById("display");
  const attemptsEl = document.getElementById("attempts");

  let secret, attempts, finished;

  function newGame() {
    secret = Math.floor(Math.random() * 100) + 1;
    attempts = 0;
    finished = false;
    input.value = "";
    input.disabled = false;
    tryBtn.disabled = false;
    display.textContent = "?";
    attemptsEl.textContent = "0";
    message.textContent = "À toi de jouer ! 🍀";
    input.focus();
  }

  function guessNumber() {
    if (finished) return;

    const value = input.value.trim();
    const number = Number(value);

    if (value === "" || !Number.isInteger(number) ||
        number < 1 || number > 100) {
      message.textContent = "Entre un nombre entier de 1 à 100 !";
      return;
    }

    attempts++;
    attemptsEl.textContent = attempts;

    if (number === secret) {
      display.textContent = secret;
      message.textContent =
        `🎉 Bravo ! Trouvé en ${attempts} essai${attempts > 1 ? "s" : ""} !`;
      finished = true;
      input.disabled = true;
      tryBtn.disabled = true;
    } else if (number < secret) {
      message.textContent = "⬆️ C'est plus grand ! Essaie encore.";
    } else {
      message.textContent = "⬇️ C'est plus petit ! Essaie encore.";
    }

    input.value = "";
    if (!finished) input.focus();
  }

  tryBtn.addEventListener("click", guessNumber);
  input.addEventListener("keydown", event => {
    if (event.key === "Enter") guessNumber();
  });
  restartBtn.addEventListener("click", newGame);

  newGame();
})();
</script>
</body>
</html>
